name: Build VillagerPocket

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

steps:

- name: Checkout repository
uses: actions/checkout@v4

- name: Set up Java 21
uses: actions/setup-java@v5
with:
distribution: temurin
java-version: "21"

- name: Find Gradle project
id: gradle
shell: bash
run: |
BUILD_FILE=$(find . -type f \(-name "build.gradle" -o -name "build.gradle.kts"\) -not -path "/.gradle/" | head -n 1)

if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No Gradle build file found."
            find . -maxdepth 5 -type f | head -n 200
            exit 1
          fi

PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "dir=$
