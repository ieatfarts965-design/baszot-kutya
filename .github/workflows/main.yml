
      - name: Find Gradle project
        id: gradle
        shell: bash
        run: |
          BUILD_FILE=$(find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -not -path "*/.gradle/*" -not -path "*/build/*" | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No build.gradle or build.gradle.kts found in the repository."
            echo "Repository files:"
            find . -maxdepth 5 -type f | head -n 200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Gradle project: $PROJECT_DIR"

      - name: Build plugin
        working-directory: ${{ steps.gradle.outputs.dir }}
        run: gradle --no-daemon clean build
